services:
  # Le site du jeu (statique)
  - type: web
    name: secret-santa-nozomi
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # Le serveur multijoueur (WebSocket, Node sans dépendance)
  - type: web
    name: secret-santa-nozomi-ws
    runtime: node
    plan: free
    buildCommand: "echo pas de build"
    startCommand: node server.js
    healthCheckPath: /health
